name: Bug report
description: Report a reproducible AuthModules defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include raw tokens, passwords, OTP values, personal data, or private provider responses.
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@authmodules/core 0.1.0"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the failure and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a sanitized, minimal example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: "Node.js 24, PostgreSQL 17"
